<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Taller de Valentina</title>
    
    <!-- Fuente Elegante desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Librería Oficial de Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #fdfbfb;
            font-family: 'Poppins', sans-serif;
            margin: 30px auto;
            max-width: 550px;
            padding: 30px 25px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 180, 190, 0.15);
            border: 1px solid #f2e6e8;
        }

        .logo-negocio {
    display: block;
    margin: 0 auto 20px auto;
    max-width: 170px;         /* Tamaño perfecto para que no acapare toda la pantalla */
    height: 170px;            /* Al hacerlo cuadrado igual que el ancho... */
    object-fit: cover;        /* ...mantiene la proporción impecable */
    border-radius: 50%;       /* 👈 ¡Esto lo vuelve un círculo perfecto! */
    box-shadow: 0 4px 15px rgba(212, 122, 143, 0.25); /* Sombra rosa suave */
    border: 3px solid #ffffff; /* Borde blanco fino alrededor */

        }

        h1 {
            color: #d47a8f; /* Rosa sofisticado */
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 34px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .slogan {
            color: #8c7b83;
            text-align: center;
            font-size: 15px;
            font-weight: 300;
            margin-bottom: 15px;
            font-style: italic;
        }

        .descripcion {
            color: #6e5e65;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        hr {
            border: 0;
            border-top: 1px dashed #e8d5da;
            margin: 25px 0;
        }

        /* Botones estilo Boutique */
        button, .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        button:hover, .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-secundario {
            background: linear-gradient(135deg, #e295a7, #d47a8f);
            box-shadow: 0 4px 12px rgba(212, 122, 143, 0.25);
        }

        .btn-secundario:hover {
            background: linear-gradient(135deg, #d47a8f, #c2677c);
            box-shadow: 0 6px 15px rgba(212, 122, 143, 0.35);
        }
    </style>
</head>
<body>

    <!-- Tu logo (asegúrate de que el nombre coincida) -->
    <img src="logo.png" alt="El Taller de Valentina" class="logo-negocio">
    
    <h1>El Taller de Valentina</h1>
    <div class="slogan">Creaciones hechas con amor & detalle ✨</div>
    
    <!-- Texto mucho más cálido y atractivo -->
    <p class="descripcion">
        Diseños exclusivos en moños, lazos y accesorios personalizados para hacer brillar cada momento especial. 🎀
    </p>

    <hr>

    <!-- Botones de Navegación -->
    <a href="producto.html">
        <button type="button" class="btn-secundario">✨ Ver Catálogo de Creaciones🎀💝</button>
    </a>
    
    <a href="https://wa.me/50242731311?text=Hola,%20quisiera%20pedir%20informaci%C3%B3n%20sobre%20un%20dise%C3%B1o%20personalizado" target="_blank">
        <button type="button">💬 Consultas y Pedidos Especiales por WhatsApp</button>
    </a>

</body>
</html>
